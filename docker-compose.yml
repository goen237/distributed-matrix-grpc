# version: '3.8'
services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker

    environment:
      WORKER_PORT: 12345
    networks:
      - app-network
    deploy:
      replicas: ${WORKER_COUNT}

  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    container_name: controller
    depends_on:
      - worker
    networks:
      - app-network
    environment:
      - WORKER_COUNT=${WORKER_COUNT}
    entrypoint:  ["python", "controller.py"]

networks:
  app-network:
    driver: bridge
