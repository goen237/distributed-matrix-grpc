# version: '3.8'
services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      WORKER_PORT: 12345
    volumes:
      - H:\HDA_info\Semestre_4\Verteilte Systeme\Praktikum\group_d_2\data\rtt_data.json:/app/data/rtt_data.json
    networks:
      - app-network
    deploy:
      replicas: ${WORKER_COUNT}
      endpoint_mode: dnsrr # erlaubt es, dass der Controller die Worker direkt ansprechen kann
    entrypoint:  ["python", "worker.py"]

  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    container_name: controller
    depends_on:
      - worker
    networks:
      - app-network
    environment:
      - WORKER_COUNT=${WORKER_COUNT}
    entrypoint:  ["python", "controller.py"]

  http_server:
    build:
      context: .
      dockerfile: Dockerfile.http_server
    container_name: http_server
    networks:
      - app-network
    ports:
      - "8080:80"
    environment:
      - WORKER_COUNT=${WORKER_COUNT}
    entrypoint:  ["python", "http_server.py"]

networks:
  app-network:
    driver: bridge

